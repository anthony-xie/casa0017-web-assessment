<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Place</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <button id="toggleSidebar" type="button" class="sidebar-toggle" aria-label="Toggle panel" aria-expanded="true">
            <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </button>

        <div class="sidebar-body">
            <div class="logo">Find a Place</div>

            <form id="postcodeForm" class="postcode-form">
                <div id="postcodeList"></div>
                <button id="addPerson" type="button" class="add-button" aria-label="Add person">
                    <i class="bi bi-plus-circle-dotted" aria-hidden="true"></i>
                </button>
                <button id="findPlace" type="submit" class="btn btn-dark find-button">Find</button>
                <p id="formMessage" class="form-message" role="status"></p>
            </form>

            <section id="placesBox" class="places" hidden>
                <h2 class="places-title">Places nearby</h2>
                <ul id="placeList" class="place-list"></ul>
            </section>
        </div>
    </aside>

    <main class="map-container">
        <div id="map"></div>

        <div id="searching" class="searching" aria-hidden="true">
            <span></span><span></span><span></span>
            <i class="searching-dot"></i>
        </div>

        <div id="intro" class="intro">
            <p class="intro-title">
                Find a fair place to meet
                <span class="intro-fade">for everyone</span>
            </p>
        </div>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.polyline.snakeanim@0.2.0/L.Polyline.SnakeAnim.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.smooth_marker_bouncing@3.0.3/dist/bundle.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/scripts.js"></script>
</body>
</html>
